worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 80;
        server_name _;

        # Landing page (catch-all — also handles the internal /index.html redirect)
        location / {
            root /usr/share/nginx/landing;
            index index.html;
        }

        # Ella EMS API (strip /ella_ems prefix before forwarding)
        location /ella_ems/api/ {
            rewrite ^/ella_ems(/api/.*)$ $1 break;
            proxy_pass         http://backend-api:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # SmartMeter hardware push receiver (no prefix strip needed — sim handles /smartmeter)
        location /ella_ems/smartmeter {
            rewrite ^/ella_ems(/smartmeter.*)$ $1 break;
            proxy_pass         http://simulation:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
        }

        # Ella EMS Simulation API (strip /ella_ems prefix)
        location /ella_ems/sim/ {
            rewrite ^/ella_ems(/sim/.*)$ $1 break;
            proxy_pass         http://simulation:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # Ella EMS React SPA
        location /ella_ems/ {
            alias /usr/share/nginx/ella_ems/;
            try_files $uri /ella_ems/index.html;
        }
    }
}
