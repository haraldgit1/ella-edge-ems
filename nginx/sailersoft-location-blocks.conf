# ── Ella Edge EMS ────────────────────────────────────────────────────────────
# Diese Location-Blocks in den bestehenden server{}-Block von
# /app/web/nginx/conf.d/<your-vhost>.conf einfügen.
#
# Voraussetzung: ella_ems mit docker-compose.prod.yml gestartet,
# sodass ella-backend-api und ella-simulation im "webnet" Netzwerk sind.
# ─────────────────────────────────────────────────────────────────────────────

# Ella EMS API (strip /ella_ems prefix)
location /ella_ems/api/ {
    rewrite ^/ella_ems(/api/.*)$ $1 break;
    proxy_pass         http://ella-backend-api:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

# SmartMeter hardware push receiver
location /ella_ems/smartmeter {
    rewrite ^/ella_ems(/smartmeter.*)$ $1 break;
    proxy_pass         http://ella-simulation:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
}

# Ella EMS Simulation API (strip /ella_ems prefix)
location /ella_ems/sim/ {
    rewrite ^/ella_ems(/sim/.*)$ $1 break;
    proxy_pass         http://ella-simulation:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# Ella EMS React SPA — statische Dateien vom Host-Pfad
# Passe den alias-Pfad an, wo Du das frontend/dist auf dem Server ablegst.
location /ella_ems/ {
    alias /app/ella_ems/frontend/dist/;
    try_files $uri /ella_ems/index.html;
}
